project:
  type: default

format:
  html:
    webr:
      show-code: false
    theme:
      light: lux
    number-sections: true
    toc: true
    toc-location: left
    toc-expand: 0
    smooth-scroll: true
    link-external-newwindow: true
    code-tools: false
    css: styles.css

# Las celdas webR de esta clase solo usan R base: no se cargan paquetes,
# así la página queda lista en pocos segundos.
# Las prácticas con controles (semanas 5 y 6) usan la extensión live
# (r-wasm/quarto-live) con `format: live-html` declarado en su propio YAML,
# junto con las opciones de html (tema, css, toc). No se declara live-html
# aquí: hacerlo inyecta el filtro de live en todos los documentos y anula
# las celdas webR de coatless.

filters:
  - webr
