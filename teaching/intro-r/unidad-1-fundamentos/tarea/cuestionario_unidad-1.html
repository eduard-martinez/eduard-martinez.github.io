<script>
window.EXAMEN = {
  parteId: "cuestionario_u1",
  titulo: "Cuestionario — Unidad 1: Fundamentos de R",
  descripcion: "Objetos, tipos, vectores, data frames, datos faltantes y paquetes. En las preguntas de código se evalúa el resultado de lo que escribes.",
  packages: [],
  setup: `ingresos <- c(1200000, 950000, 3500000, 800000, 1300000, 2100000, 600000)
ingresos_na <- c(1200000, 800000, NA, 2500000)
personas <- data.frame(
  sexo    = c("mujer", "hombre", "mujer", "hombre", "mujer"),
  edad    = c(28, 45, 35, 52, 23),
  ingreso = c(1500000, 2200000, 1800000, 3500000, 900000),
  stringsAsFactors = FALSE)`,
  preguntas: [
    { tema: "Vectores", tipo: "escribir_codigo",
      enunciado: "Tienes el vector `ingresos`. Escribe una expresión que devuelva su **mediana**.",
      solucion: "median(ingresos)",
      respuestas: ["median(ingresos)"] },

    { tema: "Datos faltantes (NA)", tipo: "escribir_codigo",
      enunciado: "El vector `ingresos_na` tiene un dato faltante (`NA`). Escribe una expresión que devuelva su **promedio ignorando los NA**.",
      solucion: "mean(ingresos_na, na.rm = TRUE)",
      respuestas: ["mean(ingresos_na, na.rm = TRUE)"] },

    { tema: "Data frames", tipo: "escribir_codigo",
      enunciado: "Del data frame `personas`, escribe una expresión que devuelva **la columna** `ingreso`.",
      solucion: "personas$ingreso",
      respuestas: ["personas$ingreso"] },

    { tema: "Vectores lógicos", tipo: "escribir_codigo",
      enunciado: "Escribe una expresión que devuelva **cuántas personas** de `personas` tienen un `ingreso` **mayor al promedio** de esa columna.",
      solucion: "sum(personas$ingreso > mean(personas$ingreso))",
      respuestas: ["sum(personas$ingreso > mean(personas$ingreso))"] },

    { tema: "Tipos de datos", tipo: "opcion_multiple",
      enunciado: "¿Qué devuelve `class(\"Cali\")`?",
      opciones: ["`numeric`", "`character`", "`logical`", "`factor`"],
      correcta: 1 },

    { tema: "Paquetes", tipo: "verdadero_falso",
      enunciado: "`install.packages()` se ejecuta **una sola vez** (instala en el disco), y `library()` se usa **en cada nueva sesión** para cargar el paquete.",
      correcta: true },

    { tema: "Proyectos reproducibles", tipo: "opcion_multiple",
      enunciado: "¿Cuál es la principal ventaja de trabajar en un **proyecto `.Rproj`** con **rutas relativas** en vez de rutas absolutas como `\"C:/Users/ana/datos.csv\"`?",
      opciones: [
        "El código se ejecuta más rápido",
        "El proyecto es portable: funciona en otro computador sin reescribir las rutas",
        "Instala los paquetes automáticamente",
        "Convierte los datos a formato .rds"
      ],
      correcta: 1 }
  ]
};
</script>
