project:
  type: default

# Nota: esta semana no se carga webR (no hay código R ejecutable en la página;
# el trabajo con R sucede en VS Code / RStudio del estudiante).
# Si se necesitara, restaurar:  filters: [webr]  |  webr: {packages: [dplyr, ggplot2]}

format:
  html:
    theme:
      light: lux
    number-sections: true
    toc: true
    toc-location: left
    toc-expand: 0
    smooth-scroll: true
    link-external-newwindow: true
    code-tools: false
    css: styles.css
