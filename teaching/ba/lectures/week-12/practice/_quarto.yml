project:
  type: default

format:
  html:
    theme:
      light: lux
    number-sections: true
    toc: true
    toc-location: left
    toc-expand: 0
    smooth-scroll: true
    link-external-newwindow: true
    code-tools: false
    css: ../../styles.css

filters:
  - webr

webr:
  packages: [dplyr, rpart, rpart.plot]
